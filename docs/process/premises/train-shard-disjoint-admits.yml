statement: "A cold, verified v4 tier-1 gate.passed of plan dev on an older integration tip B (every D-075 condition except base == tip) also proves the PR on the current tip T when B is an ancestor of both the head H and T, T is at most train.shard_admit_max_behind first-parent merges past B, neither B..H nor B..T touches a train.shard_admit_never path (lockfiles, root manifests, the registry, the gate, unit manifests), and the units+dependents shard keys of B..H and B..T, both computed from the manifests at T with generated outputs counted as shared paths, are disjoint; the train may then merge H on T without a re-gate, and the merged tree (tree(H) plus the changes of B..T) is the computed merge of the two. Admission acts only with train.shard_admit on; shadow measures it first. This partially refutes P-43 (the exact merged tree) for this path only."
