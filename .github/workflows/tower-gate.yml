# tower/gate (the migration to GitHub, 14/11/2026; the Torre's choice (a)): the check main's merge queue requires.
# Staged here and installed by the owner as .github/workflows/tower-gate.yml (D-087: sessions may not write
# .github/workflows). A GitHub-hosted runner, free on a public repository; it runs scripts/verify-commit, the gate's own
# plan: its stages and only the script tests whose covers the diff touches, never the whole suite. The job's name is
# the check's name.
# VERDICT-REUSE (docs/process/gate-github-speed.md): a green pull request run keeps its verdict's key as an artifact; the
# merge queue's run of a commit with the same tree, parents, base, plan and runner image lets the tests' green stand and
# runs the stages again (actions: read, to list the artifacts).
# CACHE-PGDATA: the toolchain cache keeps the binaries only, never the test cluster (pgdata, its log, socket and home):
# a cluster saved while its server ran broke setup.sh on a fresh runner (run 43606632818). The key's `bin-` prefix
# leaves the entries that carried one.
# GATE-PARTS (the Torre, 16/11/2026): one tower/gate is three jobs side by side and a short one after them. `main` runs the
# stages and half the planned tests, `shard1` the other half (verify_commit.split: longest first by the cost hints), and
# `alone` the timing-bound tests of gate.isolated_tests on a runner of their own; the job named tower/gate, the check the
# merge queue requires, is green only when every part is. A green part of a pull request run keeps its verdict as
# `tower-gate-green-<key>-<part>`; the merge queue reuses the tests' verdict only when one run kept all three. A wide plan
# (a change of tower_infra/port.py plans 49 tests) took 93 s in one job; split in two halves and the timing-bound tests
# apart it runs in about half of that. Each building entry of the queue holds four runners at most (three parts and
# deploy/prepare) of the Free plan's twenty.

name: tower-gate
on:
  pull_request:
    branches: [main]
  merge_group:
permissions:
  contents: read
  actions: read
concurrency:
  group: tower-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  part:
    name: gate part (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [main, shard1, alone]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            .toolchain
            !.toolchain/pgdata
            !.toolchain/postgres.log
            !.toolchain/pgsocket
            !.toolchain/pghome
          key: toolchain-bin-${{ runner.os }}-${{ hashFiles('scripts/cloud/toolchain.json', 'config/registry/toolchain.json') }}
      - name: toolchain
        run: bash scripts/cloud/setup.sh
      - name: verify
        id: verify
        env:
          EVENT: ${{ github.event_name }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PART: ${{ matrix.part }}
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$PR_BASE"
          verdict=(--record "$RUNNER_TEMP/verdict")
          if [ "$EVENT" = merge_group ]; then base="$QUEUE_BASE"; verdict=(--reuse); fi
          source scripts/cloud/env.sh
          scripts/verify-commit --sha "$GITHUB_SHA" --base "$base" --repo "$GITHUB_REPOSITORY" --no-post --part "$PART" "${verdict[@]}"
      - name: keep the green verdict
        if: github.event_name == 'pull_request' && steps.verify.outputs.verdict != ''
        continue-on-error: true  # no record only costs the merge queue's run its reuse, never this verdict
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.verify.outputs.verdict }}
          path: ${{ runner.temp }}/verdict
          retention-days: 7
          if-no-files-found: error
  gate:
    name: tower/gate
    needs: part
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every part green
        env:
          PARTS: ${{ needs.part.result }}
        run: |
          echo "the parts of tower/gate: $PARTS"
          test "$PARTS" = success
