# tower-gate-attest (SALTO 2 — D-087, D-359, C7 / THREAT-gate): instalado pela Torre, D-359 (after conditions B/C/D).
# Staged Salto 2 draft closing THREAT-gate (fork PR spoofing tower/gate under GitHub Actions integration_id 15368).
# Under D-359, workflow logic stays unchanged here and must satisfy conditions B, C, and D before Salto 2 install:
#   (B) AWS attester verifies facts independently via App token (files, head repo, exact-SHA checks) without trusting
#       a workflow-sent verdict; credentials live only in an environment restricted to main, never a repo secret.
#   (C) Triggers on completion of both tower-gate and web (and in the merge queue), attesting green only when all
#       required checks are green.
#   (D) Explicit path lets the Torre install workflows (D-087) without being blocked by tower/gate-attested.
# Staged draft summary:
#   1. Triggers on `workflow_run` (executes main's immutable workflow definition, never untrusted PR head code).
#   2. Runs main's `scripts/workflow-attest verify` and dispatches to the external GitHub App / AWS Port.
# Requires adding `.github/workflows/tower-gate-attest.yml` to `gate.allowed_workflows` in a gate PR citing D-359
# and installing to both services/runner/github/tower-gate-attest.yml and .github/workflows/tower-gate-attest.yml.
name: tower-gate-attest
on:
  workflow_run:
    workflows: ["tower-gate"]
    types: [completed]
permissions:
  contents: read
  checks: read
  pull-requests: read
concurrency:
  group: tower-gate-attest-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  attest:
    name: tower/gate-attest-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # Always checks out the default branch (main) — never untrusted PR head code.
      - name: verify immutable workflow tree and exact-head check runs
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          PR_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
        run: |
          base_sha="$PR_BASE_SHA"
          if [ -z "$base_sha" ]; then
            base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${HEAD_SHA}" --jq '.merge_base_commit.sha')"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/compare/${base_sha}...${HEAD_SHA}" --jq '[.files[].filename]' > "$RUNNER_TEMP/files.json"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" > "$RUNNER_TEMP/checks.json"
          set +e
          scripts/workflow-attest verify \
            --base "$base_sha" \
            --head "$HEAD_SHA" \
            --files "$RUNNER_TEMP/files.json" \
            --checks "$RUNNER_TEMP/checks.json" \
            --head-repo "$HEAD_REPO" \
            --base-repo "$GITHUB_REPOSITORY" \
            --json > "$RUNNER_TEMP/verdict.json"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/verdict.json"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
          else
            echo "state=failure" >> "$GITHUB_OUTPUT"
          fi
      - name: report verdict to external GitHub App attester (AWS port)
        env:
          ATTESTER_URL: ${{ secrets.TOWER_GATE_ATTESTER_URL }}
          ATTESTER_TOKEN: ${{ secrets.TOWER_GATE_ATTESTER_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BASE_SHA: ${{ steps.verify.outputs.base_sha }}
          STATE: ${{ steps.verify.outputs.state }}
        run: |
          if [ -z "$ATTESTER_URL" ] || [ -z "$ATTESTER_TOKEN" ]; then
            echo "FAIL: TOWER_GATE_ATTESTER_URL and TOWER_GATE_ATTESTER_TOKEN must be provisioned by Daniel (C7 / THREAT-gate)" >&2
            exit 1
          fi
          python3 - "$RUNNER_TEMP/verdict.json" "$ATTESTER_URL" "$STATE" "$HEAD_SHA" "$BASE_SHA" <<'PY'
          import json, os, sys, urllib.request
          verdict_path, url, state, head, base = sys.argv[1:6]
          payload = {
              "context": "tower/gate-attested",
              "state": state,
              "head_sha": head,
              "base_sha": base,
              "verdict": json.loads(open(verdict_path, encoding="utf-8").read()),
          }
          req = urllib.request.Request(
              url,
              method="POST",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['ATTESTER_TOKEN']}",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              print(f"attester answered HTTP {resp.status}: {resp.read().decode('utf-8', 'replace')[:200]}")
          PY
          test "$STATE" = success
